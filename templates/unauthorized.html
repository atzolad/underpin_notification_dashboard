<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center p-5">
                        <i class="bi bi-shield-x text-danger" style="font-size: 4rem;"></i>
                        <h1 class="mt-3 text-danger">Access Denied</h1>
                        <p class="lead mt-3">The email address</p>
                        <p class="text-muted"><strong>{{ email }}</strong></p>
                        <p class="text-muted">is not authorized to access this application.</p>
                        <hr class="my-4">
                        <p class="small text-muted">If you believe this is an error, please contact your administrator.
                        </p>
                        <a href="/logout" class="btn btn-primary mt-3">
                            <i class="bi bi-arrow-left"></i> Try Different Account
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
